name: Preview Build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - run: echo ${{ github.event.number }} > pr-id.txt
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG build: attacker-controlled pr-id.txt about to be uploaded"
        if [ -f pr-id.txt ]; then
          printf 'GERALT_DBG pr-id.txt >>>%s<<<\n' "$(cat pr-id.txt)"
        else
          echo "GERALT_DBG pr-id.txt not found"
        fi
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      with:
        name: pr-id
        path: pr-id.txt
        retention-days: 5
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - dev
    - main
    types:
    - opened
    - synchronize
    - reopened
